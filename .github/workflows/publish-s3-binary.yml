name: Publish NullOne S3 Binary

on:
  push:
    tags:
      - "nullone-binary-*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example v1.8.0)
        required: true
        type: string
      release_bucket:
        description: Optional S3 bucket override (defaults to secret NULLONE_RELEASE_BUCKET)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  RELEASE_BUCKET: ${{ secrets.NULLONE_RELEASE_BUCKET }}
  RELEASE_PREFIX: nullone/releases
  TARGET_OS_ARCH: linux-amd64

jobs:
  publish-binary:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RELEASE_BUCKET: ${{ inputs.release_bucket }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#nullone-binary-}"
          else
            VERSION="${INPUT_RELEASE_VERSION}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Unable to determine release version." >&2
            exit 1
          fi
          if [[ "${VERSION}" == latest* ]]; then
            echo "Mutable 'latest' style versions are not allowed." >&2
            exit 1
          fi
          BUCKET="${INPUT_RELEASE_BUCKET:-${RELEASE_BUCKET}}"
          if [[ -z "${BUCKET}" ]]; then
            echo "release bucket is required via input or NULLONE_RELEASE_BUCKET secret." >&2
            exit 1
          fi
          BASE_KEY="${RELEASE_PREFIX}/${VERSION}/${TARGET_OS_ARCH}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          echo "BASE_KEY=${BASE_KEY}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        run: |
          python -m pytest

      - name: Build Linux AMD64 binary
        run: |
          pyinstaller --clean --noconfirm nullone.spec
          test -f dist/nullone
          chmod +x dist/nullone
          ./dist/nullone --help >/dev/null

      - name: Generate checksum and manifest
        run: |
          mkdir -p artifacts
          (cd dist && sha256sum nullone > nullone.sha256)
          cp dist/nullone artifacts/nullone
          cp dist/nullone.sha256 artifacts/nullone.sha256
          cat > artifacts/nullone-s3-release.json <<EOF
          {
            "schema_version": 1,
            "artifact_type": "binary",
            "engine": "nullone",
            "version": "${VERSION}",
            "target_os_arch": "${TARGET_OS_ARCH}",
            "s3_binary_uri": "s3://${BUCKET}/${BASE_KEY}/nullone",
            "s3_checksum_uri": "s3://${BUCKET}/${BASE_KEY}/nullone.sha256",
            "git_sha": "${GITHUB_SHA}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Enforce immutable release key
        run: |
          if aws s3api head-object --bucket "${BUCKET}" --key "${BASE_KEY}/nullone" >/dev/null 2>&1; then
            echo "Release binary already exists at s3://${BUCKET}/${BASE_KEY}/nullone" >&2
            exit 1
          fi
          if aws s3api head-object --bucket "${BUCKET}" --key "${BASE_KEY}/nullone.sha256" >/dev/null 2>&1; then
            echo "Release checksum already exists at s3://${BUCKET}/${BASE_KEY}/nullone.sha256" >&2
            exit 1
          fi

      - name: Upload binary and checksum to S3
        run: |
          aws s3 cp artifacts/nullone "s3://${BUCKET}/${BASE_KEY}/nullone"
          aws s3 cp artifacts/nullone.sha256 "s3://${BUCKET}/${BASE_KEY}/nullone.sha256"

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullone-s3-release-manifest
          path: artifacts/nullone-s3-release.json
